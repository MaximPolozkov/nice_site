services:
  # Сайт: публичная страница + панель управления
  web:
    build: .
    env_file: .env
    volumes:
      - data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Бот: запуск по расписанию и по кнопке из панели
  worker:
    build: .
    command: ["python", "worker.py"]
    env_file: .env
    volumes:
      - data:/data
    restart: unless-stopped

  # Веб-сервер: HTTPS-сертификат Let's Encrypt для вашего домена выпускается автоматически
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-kodverks.ru}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  data:          # база и тексты отчётов
  caddy_data:    # сертификаты
  caddy_config:
